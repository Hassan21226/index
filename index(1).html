                        { id: "q_ch5_91", type: "mcq", question: "في الرعاية الصحية، أي مجال يستخدم الذكاء الاصطناعي لتحليل الأشعة السينية (X-rays) والرنين المغناطيسي (MRI) والتصوير المقطعي (CT)؟", options: ["التصوير الطبي والتشخيص", "المساعدون الصحيون الافتراضيون", "اكتشاف الأدوية وتطويرها", "التحليلات التنبؤية"], answer: 0, explanation: "التصوير الطبي والتشخيص يحلل X-rays وMRI وCT للكشف عن التشوهات بدقة وسرعة." },
                        { id: "q_ch5_92", type: "mcq", question: "في الرعاية الصحية، ما دور 'المساعدين الصحيين الافتراضيين (Virtual Health Assistants)'؟", options: ["دعم المرضى على مدار الساعة بتقديم المعلومات والمساعدة في المواعيد والنصائح الطبية الأساسية", "إجراء العمليات الجراحية بدلاً من الأطباء", "تصنيع الأدوية في المختبرات", "مراقبة الاختبارات الإلكترونية"], answer: 0, explanation: "يدعم المساعدون الصحيون الافتراضيون وروبوتات المحادثة المرضى 24/7 بالمعلومات والمواعيد والنصائح الأساسية." },
                        { id: "q_ch5_93", type: "mcq", question: "في اتجاهات مستقبل الذكاء الاصطناعي، ستُحدث قدرة النماذج التوليدية على فهم السياقات الثقافية والمشاعر الإنسانية ثورة في مجالات:", options: ["الترجمة والأدب والإعلام", "التعدين والنفط فقط", "الزراعة التقليدية فقط", "البناء المعماري فقط"], answer: 0, explanation: "ستحدث ثورة في مجالات الترجمة والأدب والإعلام بفضل فهم السياقات الثقافية والمشاعر." },

                        { id: "q_ch5_97", type: "tf", question: "[نشاط 2] 'علام' هو أول تطبيق في المملكة العربية السعودية يستخدم نموذج الذكاء الاصطناعي التوليدي لتوفير المعلومات باللغة العربية.", options: ["صح", "خطأ"], answer: 0, explanation: "صح، وهذا نص الفقرة الثانية في نشاط 2 من الفصل الخامس." },
                        { id: "q_ch5_98", type: "mcq", question: "بناءً على تحليل جزأي المصطلح في مقدمة الفصل الخامس، يمكن فهم الذكاء الاصطناعي على أنه:", options: ["القدرة على التفكير التي يصنعها الإنسان", "القدرة الجسدية التي تطورها الطبيعة", "مجموعة من الأجهزة الميكانيكية فقط", "برمجة صريحة ثابتة لكل مهمة"], answer: 0, explanation: "بما أن الذكاء يشير للقدرة على التفكير والاصطناعي لشيء من صنع الإنسان، فيُفهم على أنه 'القدرة على التفكير التي يصنعها الإنسان'." },
                        { id: "q_ch5_99", type: "mcq", question: "ما السبب الرئيسي وراء حدوث التباطؤ الكبير في تطوير الذكاء الاصطناعي خلال 'الشتاء الأول (1974–1980)'؟", options: ["التوقعات غير المحققة والقيود المتبعة في أنظمة الذكاء الاصطناعي مما أدى لانخفاض الاهتمام والتمويل", "ظهور نماذج اللغة التوليدية مثل ChatGPT", "استثمار الشركات الضخم في الأنظمة الخبيرة", "فوز الحاسب Deep Blue في الشطرنج"], answer: 0, explanation: "انخفض الاهتمام والتمويل في المقام الأول بسبب التوقعات غير المحققة والقيود المتبعة في أنظمة الذكاء الاصطناعي." },
                        { id: "q_ch5_100", type: "mcq", question: "دعم المسوقين في إنشاء حملات إعلانية بناءً على بيانات المستهلكين يُعد مثالاً على أي غرض من أغراض الذكاء الاصطناعي؟", options: ["تعزيز عملية اتخاذ القرار", "أتمتة المهام الروتينية", "تحسين الأمن والسلامة", "دعم البحث العلمي"], answer: 0, explanation: "تريك دقيق: ورد مثال دعم المسوقين في إنشاء حملات إعلانية ضمن البند الثاني 'تعزيز عملية اتخاذ القرار' إلى جانب المحللين الماليين والأطباء." },
                        { id: "q_ch5_101", type: "tf", question: "في أهمية الذكاء الاصطناعي، يتيح بند 'أتمتة المهام الروتينية' للإنسان التركيز على الأنشطة الأكثر تعقيداً وإبداعاً.", options: ["صح", "خطأ"], answer: 0, explanation: "صح، لأن الذكاء الاصطناعي يتولى المهام المتكررة والتي تستغرق وقتاً طويلاً." },

                        { id: "q_ch5_103", type: "mcq", question: "ترجمة مواقع الويب ومنشورات وسائل التواصل الاجتماعي تلقائياً للوصول إلى جمهور متعدد اللغات تُعد مثالاً على:", options: ["ترجمة محتوى الويب", "ترجمة المستندات", "الترجمة الفورية", "إنشاء التسميات التوضيحية"], answer: 0, explanation: "تندرج ترجمة المواقع ومنشورات التواصل تلقائياً تحت 'ترجمة محتوى الويب' ضمن أمثلة الترجمة الآلية بالتعلم العميق." },

                        { id: "q_ch5_111", type: "mcq", question: "في الجهود التعاونية لسدايا، ما الهدف من 'الشراكات بين القطاعين العام والخاص' وما الهدف من 'البحث والتطوير' مع المؤسسات الأكاديمية على التوالي؟", options: [

                        { id: "q_ch5_112", type: "tf", question: "في التعلم المخصص (مثل منصة Socrative)، مع تقدم الطالب يتكيف النظام تلقائياً لعرض مواد أكثر تحدياً مما يسمح له بالتحسن وفقاً لسرعته الخاصة.", options: ["صح", "خطأ"], answer: 0, explanation: "صح، وهذا يميز التعلم المخصص القائم على الذكاء الاصطناعي في التعليم." },
                        { id: "q_ch5_113", type: "mcq", question: "في مجال النقل، كيف تساهم أنظمة 'إدارة المرور (Traffic Management)' القائمة على الذكاء الاصطناعي في تيسير التنقل داخل المدن؟", options: ["بإعادة ضبط أوقات إشارات المرور وإعادة توجيه الحركة عبر طرق بديلة لتجنب الازدحام", "بمنع السيارات من السير ليلاً", "بتصنيع مركبات ذاتية القيادة فقط", "بتحديد أسعار تذاكر القطارات فقط"], answer: 0, explanation: "تراقب حركة المرور فورياً عبر المستشعرات والكاميرات وتعيد ضبط الإشارات وتوجه الحركة لطرق بديلة." },

                        { id: "q_ch5_115", type: "mcq", question: "ضمن اتجاهات تكنولوجيا الذكاء الاصطناعي المستقبلية، لماذا يتجه العالم (بما فيه المملكة) نحو وضع تشريعات وحوكمة صارمة؟", options: ["لضمان استخدام التقنيات بشكل أخلاقي يحمي الخصوصية ويمنع التحيز", "لإيقاف تطور الذكاء الاصطناعي التوليدي نهائياً", "لمنع ظهور وظائف جديدة", "لتقليل الاعتماد على الحوسبة السحابية"], answer: 0, explanation: "بند تشريعات وحوكمة الذكاء الاصطناعي يهدف لضمان الاستخدام الأخلاقي وحماية الخصوصية ومنع التحيز." },
                        { id: "q_ch5_116", type: "mcq", question: "ضمن التأثير العالمي للذكاء الاصطناعي، أي مجالات عمل جديدة سيخلقها الذكاء الاصطناعي تحت بند 'تحول الوظائف'؟", options: ["تطوير الذكاء الاصطناعي وتحليل البيانات", "الطباعة اليدوية والنسخ الورقي", "قيادة الحافلات التقليدية فقط", "مراقبة الاختبارات الورقية فقط"], answer: 0, explanation: "سيؤدي الذكاء الاصطناعي لأتمتة بعض المهام لكنه سيخلق فرص عمل جديدة في تطوير الذكاء الاصطناعي وتحليل البيانات." },
                        { id: "q_ch5_117", type: "mcq", question: "ضمن التداعيات الأخلاقية والاجتماعية، كيف يُنصح بدعم العمال المتأثرين من 'إعادة هيكلة الوظائف' بسبب الأتمتة؟", options: ["من خلال برامج التدريب وإجراءات الأمان الاجتماعي", "بإلغاء تقنيات الذكاء الاصطناعي بالكامل", "بتجاهل التغيرات في سوق العمل", "بتقليل الشفافية في الخوارزميات"], answer: 0, explanation: "من المهم تطوير استراتيجيات لدعم العمال المتأثرين من خلال برامج التدريب وإجراءات الأمان الاجتماعي." },
                        { id: "q_ch5_118", type: "mcq", question: "ضمن التداعيات الأخلاقية، يجب أن يتبع 'تطوير السياسات الأخلاقية لاستخدام الذكاء الاصطناعي' المبادئ التي تعطي الأولوية لـ:", options: ["الرفاهية والسلامة والكرامة الإنسانية", "زيادة سرعة جمع البيانات دون قيود", "الربح التجاري فقط", "استبدال القرار البشري بالكامل"], answer: 0, explanation: "البند الخامس من التداعيات الأخلاقية: الأولوية للرفاهية والسلامة والكرامة الإنسانية." },

        // Helper to expand compact question tuples into full question objects (Batch 1: +198 questions -> 700 total)
        function appendCompactQuestions(sectionId, prefix, startNum, items) {
            const sec = rawDatabase.sections.find(s => s.id === sectionId);
            if (!sec) return;
            items.forEach((item, idx) => {
                const isTf = item[0] === 'tf';
                sec.questions.push({
                    id: `${prefix}_${startNum + idx}`,
                    type: item[0],
                    question: item[1],
                    options: isTf ? ["صح", "خطأ"] : item[2],
                    answer: isTf ? item[2] : item[3],
                    explanation: isTf ? item[3] : item[4]
                });
            });
        }

            shuffleArray(arr) {
                const copy = [...arr];
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            },

            prepareQuestions(list, filterType, filterCount, shouldShuffle) {
                let filtered = list.filter(q => filterType === 'all' || q.type === filterType);
                if (shouldShuffle) {
                    filtered = this.shuffleArray(filtered);
                }
                if (filterCount !== 'all') {
                    const limit = parseInt(filterCount, 10);
                    filtered = filtered.slice(0, limit);
                }
                return filtered.map(q => {
                    if (shouldShuffle && q.type === 'mcq') {
                        const indexed = q.options.map((text, idx) => ({ text, isCorrect: idx === q.answer }));
                        const shuffledOpts = this.shuffleArray(indexed);
                        return {
                            ...q,

                                    </span>
                                </div>
                                <button onclick="app.toggleBookmark('${q.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${isBookmarked ? 'bg-amber-50 dark:bg-amber-950/50 border-amber-300 dark:border-amber-700 text-amber-600 dark:text-amber-400' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500 hover:text-amber-500'}">
                                    ${isBookmarked ? '★ محفوظ' : '☆ حفظ السؤال'}
                                </button>
                            </div>

                            <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white leading-relaxed mb-6">
                                ${q.question}
                            </h3>

                            <!-- Options -->
                            <div class="space-y-3">
                                ${q.options.map((opt, oIdx) => {
                                    let btnStyle = 'border-slate-200 dark:border-slate-700 bg-slate-50/70 dark:bg-slate-800/60 hover:border-brand-600 hover:bg-brand-50/50 dark:hover:bg-brand-950/30 text-slate-800 dark:text-slate-100';
                                    let badge = `<span class="w-7 h-7 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-xs font-black shrink-0">${oIdx + 1}</span>`;

                                    if (isAnswered) {
                                        if (oIdx === q.answer) {
                                            btnStyle = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200';
                                            badge = `<span class="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center text-xs font-black shrink-0">✓</span>`;
                                        } else if (oIdx === userAns && oIdx !== q.answer) {
                                            btnStyle = 'border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-200';
                                            badge = `<span class="w-7 h-7 rounded-lg bg-rose-600 text-white flex items-center justify-center text-xs font-black shrink-0">✕</span>`;
                                        } else {
                                            btnStyle = 'border-slate-200 dark:border-slate-800 bg-slate-50/40 dark:bg-slate-900/40 text-slate-400 dark:text-slate-500 opacity-70';
                                        }
                                    }

                                    return `
                                        <button onclick="app.selectAnswer(${oIdx})" ${isAnswered ? 'disabled' : ''} class="w-full text-right p-4 rounded-2xl border-2 transition-all flex items-center gap-3 font-bold text-sm sm:text-base ${btnStyle}">
                                            ${badge}
                                            <span class="leading-relaxed">${opt}</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>

                            <!-- Immediate Explanation Box -->
                            ${isAnswered ? `
                                <div class="mt-6 p-4 rounded-2xl border ${userAns === q.answer ? 'bg-emerald-50/80 dark:bg-emerald-950/30 border-emerald-200 dark:border-emerald-800' : 'bg-rose-50/80 dark:bg-rose-950/30 border-rose-200 dark:border-rose-800'}">
                                    <div class="flex items-center gap-2 font-black text-sm mb-1.5 ${userAns === q.answer ? 'text-emerald-800 dark:text-emerald-300' : 'text-rose-800 dark:text-rose-300'}">
                                        <span>${userAns === q.answer ? '✅ إجابة صحيحة! أحسنت' : '❌ إجابة خاطئة — التفسير الأكاديمي:'}</span>
                                    </div>
                                    <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
                                        ${q.explanation}
                                    </p>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Bottom Navigation Controls -->
                        <div class="flex items-center justify-between gap-3">
                            <button onclick="app.goToQuestion(${idx - 1})" ${idx === 0 ? 'disabled' : ''} class="px-5 py-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs sm:text-sm font-bold disabled:opacity-40 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                                ← السابق
                            </button>

                            <div class="flex items-center gap-2">
                                ${idx < questions.length - 1 ? `
                                    <button onclick="app.goToQuestion(${idx + 1})" class="px-6 py-3 rounded-2xl bg-brand-900 hover:bg-brand-800 text-white text-xs sm:text-sm font-extrabold shadow-md shadow-brand-900/20 transition">
                                        السؤال التالي →
                                    </button>
                                ` : ''}
                                <button onclick="app.finishQuiz()" class="px-5 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-extrabold shadow-md transition">
                                    إنهاء وعرض النتيجة
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            finishQuiz() {
                this.state.currentView = 'results';
                const questions = this.state.questions;
                let correct = 0;
                let wrong = 0;
                let unanswered = 0;
                const wrongQuestions = [];

                questions.forEach(q => {
                    const a = this.state.answers[q.id];
                    if (a === undefined) {
                        unanswered++;
                        wrongQuestions.push(q);
                    } else if (a === q.answer) {
                        correct++;
                    } else {
                        wrong++;
                        wrongQuestions.push(q);
                    }
                });

                const pct = Math.round((correct / questions.length) * 100);
                let gradeText = 'تحتاج لمراجعة إضافية';
                let gradeColor = 'text-rose-600 dark:text-rose-400';
                if (pct >= 90) { gradeText = 'ممتاز — جاهز للفاينل بامتياز! 🏆'; gradeColor = 'text-emerald-600 dark:text-emerald-400'; }
                else if (pct >= 75) { gradeText = 'جيد جداً — أداء رائع! 🌟'; gradeColor = 'text-brand-700 dark:text-brand-400'; }
                else if (pct >= 60) { gradeText = 'مقبول — راجع الأخطاء لرفع درجتك 👍'; gradeColor = 'text-amber-600 dark:text-amber-400'; }

                this._lastWrongQuestions = wrongQuestions;
                const container = document.getElementById('appContainer');
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-xl text-center">
                        <div class="w-24 h-24 mx-auto rounded-full bg-brand-50 dark:bg-brand-950/60 border-4 border-brand-600 flex items-center justify-center text-3xl font-black text-brand-900 dark:text-brand-300 mb-4">
                            ${pct}%
                        </div>
                        <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-1">انتهى الاختبار!</h2>
                        <p class="text-sm font-extrabold mb-6 ${gradeColor}">${gradeText}</p>

                        <div class="grid grid-cols-3 gap-3 mb-6">
                            <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800">
                                <div class="text-2xl font-black text-emerald-700 dark:text-emerald-400">${correct}</div>
                                <div class="text-xs font-bold text-slate-600 dark:text-slate-400">إجابة صحيحة</div>
                            </div>
                            <div class="p-4 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800">
                                <div class="text-2xl font-black text-rose-700 dark:text-rose-400">${wrong}</div>
                                <div class="text-xs font-bold text-slate-600 dark:text-slate-400">إجابة خاطئة</div>
                            </div>
                            <div class="p-4 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                                <div class="text-2xl font-black text-slate-700 dark:text-slate-300">${unanswered}</div>
                                <div class="text-xs font-bold text-slate-600 dark:text-slate-400">بدون إجابة</div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                            ${wrongQuestions.length > 0 ? `
                                <button onclick="app.retryMistakes()" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-sm shadow-md transition">
                                    🔁 مراجعة الأخطاء فقط (${wrongQuestions.length})
                                </button>
                            ` : ''}
                            <button onclick="app.showDashboard()" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-brand-900 hover:bg-brand-800 text-white font-extrabold text-sm shadow-md transition">
                                العودة للأقسام الرئيسية
                            </button>
                        </div>
                    </div>
                `;
            },

            retryMistakes() {
                if (!this._lastWrongQuestions || this._lastWrongQuestions.length === 0) return;
                this.launchQuiz(this._lastWrongQuestions, 'مراجعة الأخطاء والتثبيت 🔁');
            }
        };

        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
